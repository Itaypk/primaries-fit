<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Assistant", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #f4ecdf 0%, #e7dccb 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 1104px; height: 534px;
    background: #fbf6ee;
    border: 1px solid #e2d6c4;
    border-radius: 34px;
    padding: 62px 68px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 24px 60px -30px rgba(41, 92, 89, .45);
  }
  .badge {
    align-self: flex-start;
    font-size: 22px; font-weight: 700; letter-spacing: .5px;
    color: #295c59; background: #dbebe9;
    padding: 11px 24px; border-radius: 999px;
  }
  h1 {
    font-family: "Frank Ruhl Libre", Georgia, serif;
    font-size: 76px; line-height: 1.14; font-weight: 700; color: #221e1a;
    margin: 30px 0 20px;
  }
  p { font-size: 30px; line-height: 1.5; color: #6b6152; max-width: 900px; }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #e2d6c4; padding-top: 26px;
  }
  .brand {
    font-family: "Frank Ruhl Libre", Georgia, serif;
    font-size: 32px; font-weight: 700; color: #2b2622;
  }
  .url {
    font-size: 30px; font-weight: 700; color: #3f8a86;
    direction: ltr;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="badge">כלי עצמאי · ללא שיוך למועמד/ת</div>
      <h1>מצאו את המועמד/ת<br>שמדבר/ת בשמכם</h1>
      <p>עונים על כמה שאלות קצרות ומקבלים דירוג של מועמדי הפריימריז לפי ההתאמה לעמדות שלכם — עם הסבר מלא לכל התאמה.</p>
    </div>
    <div class="foot">
      <div class="brand">המדריך המהיר לפריימריז</div>
      <div class="url">primaries.fit</div>
    </div>
  </div>
</body>
</html>
