name: Deploy

# Fires once CI (lint + build) finishes on main, and only proceeds if it
# passed — deploying is "ship what CI already verified", not a race against
# it. Also runnable by hand for a manual redeploy without a new commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # deploy.sh does the actual git pull + build + release swap; it
          # already lives on the box (installed by server-setup.sh), so this
          # step is just "SSH in and run it" — see deploy/scripts/deploy.sh.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "deploy@${HOST}" '/opt/primaries-fit/bin/deploy.sh'
