<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Platform-level defaults. This is a multi-event app: the per-event title
         is set at runtime (see src/screens/EventLayout.tsx), and per-event,
         crawler-visible OG tags land in a later phase. Keep this copy generic —
         no single race's party or candidates. -->
    <title>primaries.fit · המדריך המהיר לפריימריז</title>
    <meta
      name="description"
      content="כלי עצמאי לדירוג מועמדים בפריימריז לפי מידת ההתאמה לעמדות שלכם — שקוף לגמרי, תמיד תדעו למה."
    />
    <meta name="theme-color" content="#3f8a86" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://primaries.fit/" />

    <!-- Shared links (WhatsApp, X, Facebook) render from these; without them a
         share is a bare URL with no title or description. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://primaries.fit/" />
    <meta property="og:site_name" content="primaries.fit" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="primaries.fit · המדריך המהיר לפריימריז" />
    <meta
      property="og:description"
      content="כלי עצמאי לדירוג מועמדים בפריימריז לפי מידת ההתאמה לעמדות שלכם — שקוף לגמרי, תמיד תדעו למה."
    />
    <meta property="og:image" content="https://primaries.fit/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="primaries.fit — המדריך המהיר לפריימריז" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
